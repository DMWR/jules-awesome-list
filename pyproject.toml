[tool.poetry]
name = "jules-awesome-list"
version = "0.1.0"
description = "A demonstration of AI-assisted development with Jules."
authors = ["Jules <jules@google.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-mock = "^3.15.1"
git-cliff = "^2.10.1"
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"